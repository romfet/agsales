# CI/CD для self-hosted GitLab.
# Раннер: android-runner на хосте 192.168.2.130 (тег `docker`), с доступом к Docker.
# Пайплайн: тесты + публикация образов в Nexus. Деплой на стенд НЕ делается —
# образы забираются из Nexus и разворачиваются в целевом контуре вручную/отдельно.
# CI/CD Variables (Settings → CI/CD → Variables):
#   POSTGRES_USER / POSTGRES_DB / POSTGRES_PASSWORD — для эфемерной БД в test-джобе.
#   NEXUS_REGISTRY   — хост docker-registry Nexus (nexus.rumsk01.keenetic.link)
#   NEXUS_USER       — пользователь Nexus с правом push (gitlab)
#   NEXUS_PASSWORD   — его пароль (masked+protected). Пусто → стадия publish пропускается.
#   NEXUS_RAW_REPO   — имя raw-hosted репозитория для deploy-раздатки (деф. agsales-raw).

# docker-executor: образ с Docker CLI; команды идут в хостовый Docker.
default:
  image: docker:27

stages:
  - test
  - publish

# --- Тесты: эфемерный postgres + pytest в образе. ---
test:
  stage: test
  tags: [docker]
  allow_failure: true          # не блокировать публикацию из-за флейка CI-докера
  script:
    - docker build -f backend/Dockerfile -t agsales-backend:ci .
    - docker network create "ci-$CI_PIPELINE_ID"
    - docker run -d --name "pg-$CI_PIPELINE_ID" --network "ci-$CI_PIPELINE_ID" --network-alias db
        -e POSTGRES_USER="$POSTGRES_USER" -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD" -e POSTGRES_DB="$POSTGRES_DB" postgres:16
    - for i in $(seq 1 30); do docker exec "pg-$CI_PIPELINE_ID" pg_isready -U "$POSTGRES_USER" && break; sleep 1; done
    - docker run --rm --network "ci-$CI_PIPELINE_ID"
        -e DATABASE_URL="postgresql+psycopg://$POSTGRES_USER:$POSTGRES_PASSWORD@db:5432/$POSTGRES_DB"
        agsales-backend:ci
        sh -c "python -m backend.db.migrate && python -m pytest -c backend/pytest.ini"
  after_script:
    - docker rm -f "pg-$CI_PIPELINE_ID" 2>/dev/null || true
    - docker network rm "ci-$CI_PIPELINE_ID" 2>/dev/null || true

# --- Публикация образов + deploy-раздатки в Nexus (только main). ---
# Собирает бэк и заливает agsales-backend:latest (+ пин по SHA) и postgres:16 в
# docker-hosted, а docker-compose.deploy.yml + .env.example — в raw-hosted репозиторий.
# Деплой на стенд не выполняется. Пропускается, если NEXUS_PASSWORD не задан.
# Требует у docker-hosted репозитория политику «Allow redeploy» (перезапись тегов).
publish:
  stage: publish
  tags: [docker]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $NEXUS_PASSWORD'
  script:
    - echo "$NEXUS_PASSWORD" | docker login "$NEXUS_REGISTRY" -u "$NEXUS_USER" --password-stdin
    # бэк: собираем образ и перезаписываем latest + пин по SHA
    - docker build -f backend/Dockerfile -t agsales-backend:latest .
    - docker tag agsales-backend:latest "$NEXUS_REGISTRY/agsales-backend:latest"
    - docker tag agsales-backend:latest "$NEXUS_REGISTRY/agsales-backend:$CI_COMMIT_SHORT_SHA"
    - docker push "$NEXUS_REGISTRY/agsales-backend:latest"
    - docker push "$NEXUS_REGISTRY/agsales-backend:$CI_COMMIT_SHORT_SHA"
    # БД: зеркалируем postgres:16 (локальный образ; тянем только если его нет)
    - docker image inspect postgres:16 >/dev/null 2>&1 || docker pull postgres:16
    - docker tag postgres:16 "$NEXUS_REGISTRY/postgres:16"
    - docker push "$NEXUS_REGISTRY/postgres:16"
    # --- deploy-раздатка: compose + .env.example в raw-hosted репозиторий Nexus ---
    # Образы тянутся из docker-hosted, а docker-compose.deploy.yml (без build) и шаблон
    # .env — отсюда. Репозиторий создаётся best-effort (нужны admin-права у $NEXUS_USER;
    # нет прав → создание молча пропускается, а заливка упадёт с понятной 404 — тогда
    # создать raw-hosted репозиторий $RAW в UI Nexus один раз вручную).
    - apk add --no-cache curl >/dev/null   # в образе docker:27 curl нет
    - RAW="${NEXUS_RAW_REPO:-agsales-raw}"; BASE="https://$NEXUS_REGISTRY"
    - >
      curl -s -o /dev/null -w 'create %{http_code}\n' -u "$NEXUS_USER:$NEXUS_PASSWORD"
      -X POST "$BASE/service/rest/v1/repositories/raw/hosted" -H 'Content-Type: application/json'
      -d "{\"name\":\"$RAW\",\"online\":true,\"storage\":{\"blobStoreName\":\"default\",\"strictContentTypeValidation\":false,\"writePolicy\":\"ALLOW\"}}" || true
    - curl -sf -u "$NEXUS_USER:$NEXUS_PASSWORD" --upload-file docker-compose.deploy.yml "$BASE/repository/$RAW/agsales/docker-compose.deploy.yml"
    - curl -sf -u "$NEXUS_USER:$NEXUS_PASSWORD" --upload-file .env.example "$BASE/repository/$RAW/agsales/.env.example"
    - echo "deploy-bundle → $BASE/repository/$RAW/agsales/"
  after_script:
    - docker logout "$NEXUS_REGISTRY" || true
