# nginx reverse-proxy для сервиса аналитики (api на 127.0.0.1:5050).
# Подставьте свой домен и TLS-сертификат. Положить в /etc/nginx/conf.d/ или sites-available.

server {
    listen 80;
    server_name ag-assistant.example.ru;     # ВАШ домен
    return 301 https://$host$request_uri;     # весь трафик на HTTPS
}

server {
    listen 443 ssl;
    server_name ag-assistant.example.ru;      # ВАШ домен

    # TLS (например, Let's Encrypt). Замените пути.
    ssl_certificate     /etc/letsencrypt/live/ag-assistant.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ag-assistant.example.ru/privkey.pem;

    # ingest-пачки истории бывают крупными — поднимаем лимит тела.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
