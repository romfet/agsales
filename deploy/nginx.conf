# nginx на хосте 192.168.2.130.
# Внешний доступ: http://sgsales.rumsk01.keenetic.link:99
#   keenetic пробрасывает WAN:99 → этот хост:99, nginx слушает 99 и проксирует на api.
# Положить в /etc/nginx/conf.d/agsales.conf, затем: nginx -t && systemctl reload nginx
#
# Внимание: трафик по HTTP (без TLS) — токены/данные идут открытыми. Для теста ок;
# для прод желательно TLS (тогда listen 99 ssl + сертификат).

server {
    listen 99;
    listen [::]:99;
    server_name sgsales.rumsk01.keenetic.link;

    client_max_body_size 50m;        # ingest-пачки истории бывают крупными

    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
