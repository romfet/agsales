[pytest]
asyncio_mode = auto
# Async-фикстуры и тесты — на одном session-loop: общий engine (создаётся при импорте
# db/session.py) кэширует соединения, привязанные к циклу; общий цикл убирает
# «attached to a different loop» между module-фикстурой и function-тестами.
asyncio_default_fixture_loop_scope = session
markers =
    integration: requires a running PostgreSQL (set TEST_DATABASE_URL or DATABASE_URL)
testpaths = backend/tests
filterwarnings =
    ignore::pytest.PytestDeprecationWarning
