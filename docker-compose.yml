# Unified stack: Postgres + migrate + FastAPI + worker.
# Two-endpoint service: POST /api/ingest/* (1С push) and POST /api/analyze.
# Секреты — только из .env (см. .env.example), в этом файле их нет.
#
#   docker compose up -d --build        # API + docs at http://localhost:5050/docs
#
# NOTE: `migrate` only applies the schema (no mock seed) — stand starts empty and
# is filled by the real 1С feed. For local dev with mock data run `python -m
# backend.sync.seed_mock` manually.
name: agsales

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agsales}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required — see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-agsales}
    # БД доступна только внутри сети compose (db:5432); на хост не пробрасываем.
    # Для локальной отладки можно временно добавить: ports: ["127.0.0.1:5433:5432"].
    volumes:
      - agsales_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agsales}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: agsales-backend
    command: python -m backend.db.migrate
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agsales}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agsales}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: agsales-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agsales}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agsales}
      # Из .env (рядом с docker-compose.yml). ПУСТО = авторизация открыта (только локально!).
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_CLIENTS: ${AUTH_CLIENTS:-[]}
    ports:
      - "127.0.0.1:5050:5050"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: agsales-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m backend.sync.worker
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agsales}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agsales}
      REFRESH_INTERVAL_MINUTES: ${REFRESH_INTERVAL_MINUTES:-10}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  agsales_pgdata:
